<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Arena - QuiznGroww</title>
  <meta name="description" content="Engage in live interactive quizzes with countdown timers, lifelines, instant explanations, and streaks." />
  
  <link rel="stylesheet" href="/css/style.css?v=4.4">
  
  <!-- Google Identity Services for 100% Reliable Google Login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Canvas confetti for score celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script src="/js/theme.js?v=4.0"></script>
  <script src="/js/sound.js?v=4.0"></script>
  <script src="/js/auth.js?v=4.4"></script>
</head>

<body>
  <!-- Minimalist Header during Quiz Arena -->
  <header class="site-header">
    <div class="header-container">
      <div style="display:flex; align-items:center; gap:16px;">
        <a href="/topics" class="icon-action-btn" title="Back to Topics">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <a href="/" class="brand-link">
          <div class="brand-icon-box" style="width:32px; height:32px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
          </div>
          <span>Quizn<span class="brand-gradient-text">Groww</span></span>
        </a>
      </div>

      <div class="header-actions">
        <!-- Sound Toggle -->
        <button class="icon-action-btn sound-toggle-btn" title="Toggle Sound">
          <svg class="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          <svg class="sound-icon-off" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <!-- Theme Toggle -->
        <button class="icon-action-btn theme-toggle-btn" title="Toggle Theme">
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon-moon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <div id="user-greeting-container"></div>
        <div id="auth-button-slot"></div>
      </div>
    </div>
  </header>

  <!-- Quiz Arena Mount Point -->
  <main class="page-container" style="padding-top: 16px; position: relative;">
    <!-- Peripheral Floating Knowledge Glyphs in Arena Margins (Subtle & Uncluttered: ⏱️, 🔥, 🏆) -->
    <div class="floating-glyph-cluster" aria-hidden="true" style="opacity: 0.35;">
      <span class="floating-glyph glyph-1" style="top: 14%; right: 3%;" title="Blitz Countdown">⏱️</span>
      <span class="floating-glyph glyph-2" style="bottom: 25%; left: 3%;" title="Accuracy Streak">🔥</span>
      <span class="floating-glyph glyph-3" style="top: 50%; right: 4%;" title="Hall of Fame">🏆</span>
    </div>

    <div id="quiz-app-container" class="quiz-arena-container">
      <div style="text-align: center; padding: 60px 20px;">
        <div class="brand-icon-box" style="margin: 0 auto 20px; animation: floatSubtle 2s infinite ease-in-out;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <h2>Preparing Your Challenge...</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">Fetching curated questions and initializing timer.</p>
      </div>
    </div>
  </main>

  <script src="/js/quiz.js?v=4.3"></script>
</body>
</html>
